name: drift-bottle
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drift_bottle
      MYSQL_USER: drift_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python3 scripts/setup_db.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 scripts/setup_db.py first}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --general-log=OFF
      - --slow-query-log=OFF
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - 'mysql://drift_app:${MYSQL_PASSWORD}@tcp(mysql:3306)/drift_bottle?charset=utf8mb4&parseTime=true&loc=UTC'
    command: [up]
volumes:
  mysql_data:
