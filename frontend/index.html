<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#94b5c9" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='30' fill='%235c807b'%3E∿%3C/text%3E%3C/svg%3E"
    />
    <title>漂流瓶 · 一片属于你的海</title>
  </head>
  <body>
    <div id="scene" aria-label="可以探索的三维海岛"></div>
    <div id="veil"></div>
    <header id="header">
      <button class="brand" data-action="home" aria-label="回到海面">
        <span class="brand-symbol">∿</span>漂流瓶<span
          class="brand-line"
        ></span>
      </button>
      <div class="header-right">
        <button id="sound" aria-label="开启海浪声音">
          声音 关 <span>≋</span></button
        ><button data-action="about" class="quiet">本地体验</button>
      </div>
    </header>
    <main id="ui">
      <div id="hotspots"></div>
      <section id="caption" aria-live="polite"></section>
      <nav id="navigation" aria-label="海岛导航"></nav>
    </main>
    <dialog id="sheet" aria-label="信纸"><div id="sheet-content"></div></dialog>
    <div id="toast" role="status"></div>
    <div id="cursor" aria-hidden="true"><i></i></div>
    <div id="loading">
      <span class="loading-bottle">∿</span>
      <p>海面正在苏醒</p>
      <small>这一集，有人演过。</small>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
