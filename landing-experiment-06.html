<body><div class="sea-wave" aria-hidden="true"></div><div class="shell"><nav aria-label="主导航"><a class="brand" href="#"><span class="logo" aria-hidden="true"></span>漂流瓶</a><span class="nav-right">把话，留给走过这段路的人。</span></nav><main class="ocean"><div class="bottle-stage" id="bottle-stage"><div class="sea-ring"></div><div class="sea-ring ring-two"></div><span class="sea-caption">有一段话，想留给懂的人。</span><canvas id="bottle-canvas" role="img" aria-label="可拖动旋转的漂流瓶，点击或使用下方按钮打开信纸"></canvas><div id="bottle-fallback" hidden aria-hidden="true">🍾</div><button class="bottle-open" id="bottle-open">打开瓶塞 ↗</button><div class="bottle-seal" id="seal-mark" aria-hidden="true" hidden>信已装好</div><div id="sealed-actions" hidden><button id="toss-button">向海面抛出 ↗</button><button id="reopen-button">打开再看看</button></div><span class="bottle-hint" id="bottle-hint">点一下打开 · 拖动转一转</span></div><div id="finished" class="status-note" hidden role="status"><h2 id="finished-title"></h2><p id="finished-message"></p><button id="again">让瓶子回来</button></div></main><div class="journey-track" aria-label="当前交互阶段"><span class="current" data-phase="open">开瓶</span><i></i><span data-phase="write">写信</span><i></i><span data-phase="seal">装好</span><i></i><span data-phase="send">出发</span></div><footer class="ocean-footer"><button class="small-action" id="about-open">这只瓶子会去哪里？</button><span>交互原型 · 不发送、不保存</span></footer></div>

<dialog id="about" aria-labelledby="about-title"><h2 id="about-title">漂向经历相似、愿意回应的人。</h2><p>这不是随机投递。正式产品会在你确认后，向符合目标经历的过来人发出邀请。AI 帮忙找人，真人写回信；最多追问一次，不需要加好友。</p><p>当前只演示写信和封瓶，不会匹配或发送。写过的经历只有本人确认、主动开放后才可接收邀请。</p><button id="about-close">知道了</button></dialog>
<script>
(() => {
 const paper=document.getElementById('paper');
 const byId=id=>document.getElementById(id);
 let mode='seek',step='edit-page',timer,sealed=false,launched=false;
 function phase(value){document.querySelectorAll('[data-phase]').forEach(x=>x.classList.toggle('current',x.dataset.phase===value));}
 const drafts={seek:'',share:''};
 function show(id){step=id;['edit-page','target-page','review-page'].forEach(x=>byId(x).hidden=x!==id);}
 window.openBottlePaper=()=>{
   if(paper.open)return;
   if(launched)return;
   if(sealed){sealed=false;byId('sealed-actions').hidden=true;byId('seal-mark').hidden=true;byId('bottle-open').hidden=false;document.dispatchEvent(new Event('bottle-unseal'));}
   phase('write');

   timer=setTimeout(()=>{paper.showModal();const focus=step==='edit-page'?'letter-body':step==='target-page'?'target-body':'release';byId(focus).focus();},matchMedia('(prefers-reduced-motion:reduce)').matches?0:240);
 };

   document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===mode)));
   byId('paper-title').textContent=mode==='seek'?'最近，你正在经历什么？':'哪一集，你已经走过？';
   byId('paper-desc').textContent=mode==='seek'?'写几句，找个走过这段路的人聊聊。':'成功或遗憾都算。写下你真实走过的一段。';
   byId('letter-body').placeholder=mode==='seek'?'我现在大二，想换个方向，但还没想好……':'第一次找实习，我也投了很多份没有回音的简历……';
   byId('share-options').hidden=mode!=='share';byId('continue').textContent=mode==='seek'?'写好了，选想找的人 →':'看看我的经历 →';byId('body-error').textContent='';
 }
 document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>setMode(x.dataset.mode)));
 byId('paper-close').addEventListener('click',()=>paper.close());

 function review(){show('review-page');byId('review-body').textContent=byId('letter-body').value.trim();
   byId('review-title').textContent=mode==='seek'?'把这一集放进瓶子。':'留好你走过的这一集。';
   byId('review-label').textContent=mode==='seek'?'想遇见走过这样一段路的人':'想对当时的自己说';
   byId('review-extra').textContent=mode==='seek'?byId('target-body').value.trim():(byId('reflection').value.trim()||'暂时留白');

   byId('release').textContent='卷好信纸，放回瓶中 ↓';byId('release').focus();
 }
 byId('continue').addEventListener('click',()=>{
   if(!byId('letter-body').value.trim()){byId('body-error').textContent='从一句话开始就好。';byId('letter-body').focus();return;}

 });
 byId('target-next').addEventListener('click',()=>{if(!byId('target-body').value.trim()){byId('target-error').textContent='说说你希望对方经历过什么。';byId('target-body').focus();return;}byId('target-error').textContent='';review();});

  canvas.style.touchAction='none';
  if (!gl) {
    canvas.hidden = true;
    document.getElementById('bottle-fallback').hidden = false;
    hint.textContent = '点击按钮打开瓶子';
    return;
  }
  function shader(type, source) {
    const result=gl.createShader(type); gl.shaderSource(result,source); gl.compileShader(result);
    if(!gl.getShaderParameter(result,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(result));

  }
  const vs = shader(gl.VERTEX_SHADER, `
    attribute vec3 aPos; attribute vec3 aNormal;
    uniform vec2 uAngles; uniform float uAspect; uniform float uLift;
    varying vec3 vN; varying vec3 vP; varying vec3 vLocal;
    void main(){
      vec3 p=aPos; p.y+=uLift; vec3 n=aNormal;
      float c=cos(uAngles.x),s=sin(uAngles.x);

      c=cos(uAngles.y);s=sin(uAngles.y);
      mat3 rx=mat3(1.,0.,0., 0.,c,s, 0.,-s,c);
      c=cos(-.24);s=sin(-.24);
      mat3 rz=mat3(c,s,0., -s,c,0., 0.,0.,1.);

      vN=n;vP=p;vLocal=aPos;

  const fs = shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    varying vec3 vN;varying vec3 vP;varying vec3 vLocal;
    uniform vec3 uColor;uniform float uGlass;uniform float uPaper;
    void main(){
      vec3 n=normalize(vN);vec3 eye=normalize(vec3(0.,0.,5.3)-vP);
      float diff=max(dot(n,normalize(vec3(-2.,3.,4.))),0.);
      float rim=pow(1.-abs(dot(n,eye)),2.2);
      float spec=pow(max(dot(reflect(-normalize(vec3(-2.,3.,4.)),n),eye),0.),45.);
      vec3 col=uColor*(.73+.27*diff)+vec3(.45)*spec;
      float alpha=1.;
      if(uGlass>.5){
        col=mix(vec3(.70,.87,.80),vec3(.30,.61,.54),rim*.7);
        col+=vec3(.5)*spec;
        float line=pow(max(0.,dot(n,normalize(vec3(-.7,.2,1.)))),30.);
        col+=line*.27;

        float yy=vLocal.y;

  const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);

  const position=gl.getAttribLocation(program,'aPos'),normal=gl.getAttribLocation(program,'aNormal');

  function lathe(profile,segments=80){
    const data=[];

    }
    for(let i=0;i<profile.length-1;i++)for(let j=0;j<segments;j++){
      const a=j/segments*Math.PI*2,b=(j+1)/segments*Math.PI*2;

  const bottle=lathe([[0,-1.18],[.35,-1.18],[.48,-1.14],[.54,-1.05],[.56,-.92],[.56,.40],[.54,.61],[.48,.76],[.36,.91],[.23,1.02],[.20,1.13],[.20,1.48],[.23,1.49],[.24,1.54],[.23,1.59],[.16,1.59],[.16,1.49],[.16,1.13]]);
  const bottom=lathe([[0,-1.14],[.4,-1.14],[.50,-1.10],[.51,-1.04]]);
  const cork=lathe([[0,1.46],[.16,1.46],[.185,1.70],[.17,1.75],[0,1.75]]);
  const paper=lathe([[.22,-.67],[.25,-.64],[.25,.51],[.22,.54],[.205,.52],[.205,-.64]]);
  const tie=lathe([[.253,-.18],[.26,-.17],[.26,-.11],[.253,-.10]]);
  let yaw=.35,pitch=-.12,lift=0,down=null,frame=0,last=0;
  const reduced=matchMedia('(prefers-reduced-motion:reduce)');
  gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  function drawMesh(mesh,color,glass=0,isPaper=0,offset=0){

  function render(time){
    const dt=Math.min((time-last)/1000,.04);last=time;
    const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);

    gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

    gl.depthMask(false);gl.enable(gl.CULL_FACE);gl.cullFace(gl.FRONT);drawMesh(bottle,[.6,.8,.7],1);
    gl.cullFace(gl.BACK);drawMesh(bottle,[.6,.8,.7],1);drawMesh(bottom,[.6,.8,.7],1);gl.disable(gl.CULL_FACE);gl.depthMask(true);

  canvas.addEventListener('pointerdown',e=>{down={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,distance:0};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});

  canvas.addEventListener('pointercancel',()=>{down=null;canvas.classList.remove('dragging');});
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);if(!document.hidden){last=performance.now();frame=requestAnimationFrame(render);}});
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(frame);canvas.hidden=true;document.getElementById('bottle-fallback').hidden=false;hint.textContent='点击按钮打开瓶子';});
  frame=requestAnimationFrame(render);
})();

</script></body></html>
